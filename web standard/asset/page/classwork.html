<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elixr University | Classwork</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css"/>
    <link rel="stylesheet" href="../../css/dashboard.css"/>
</head>
<body>
    <!-- Nav -->
    <nav>
      <button class="nav-toggle" aria-label="toggle menu">
        <i class="fas fa-bars"></i>
      </button>
    
      <ul class="mb-0 nav-links">
        <li class="nav-item"><a class="nav-link" href="../../student.html">HOME</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">DASHBOARD</a></li>
        <li class="nav-item"><a class="nav-link" href="calendar.html">CALENDAR</a></li>
        <li class="nav-item"><a class="nav-link" href="announcements.html">ANNOUNCEMENTS</a></li>
        <li class="nav-item"><a class="nav-link active" href="classwork.html">CLASSWORK</a></li>
        
        <li class="nav-item dropdown" id="welcome-dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
            <span id="welcome-name">Welcome!</span>
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
          </ul>
        </li>
      </ul>
      <div class="logo">
        <span class="uni-name">Elixr University</span>
        <img src="../img/elixr_logo.jpg" alt="Logo" />
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-4">
        <h2 class="mb-4"><i class="fas fa-tasks me-2 text-warning"></i>Classwork</h2>
        
        <!-- Filters -->
        <div class="row mb-4">
            <div class="col-md-4 mb-2">
                <select class="form-select bg-dark text-light border-warning" id="filterClass">
                    <option value="">All Classes</option>
                </select>
            </div>
            <div class="col-md-4 mb-2">
                <select class="form-select bg-dark text-light border-warning" id="filterType">
                    <option value="">All Types</option>
                    <option value="lesson">Lessons</option>
                    <option value="lab">Labs</option>
                    <option value="quiz">Quizzes</option>
                    <option value="assignment">Assignments</option>
                </select>
            </div>
        </div>
        
        <!-- Tabs for categorization -->
        <ul class="nav nav-tabs mb-4" id="classworkTabs">
            <li class="nav-item">
                <button class="nav-link active" data-type="">All</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-type="lesson">
                    <i class="fas fa-book me-1"></i>Lessons
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-type="lab">
                    <i class="fas fa-flask me-1"></i>Labs
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-type="quiz">
                    <i class="fas fa-question-circle me-1"></i>Quizzes
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-type="assignment">
                    <i class="fas fa-file-alt me-1"></i>Assignments
                </button>
            </li>
        </ul>
        
        <!-- Classwork List -->
        <div id="classwork-list">
            <div class="text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2">Loading classwork...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-5">
        <p>&copy; 2026 Elixr University. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script>
        let allClasswork = [];
        let currentType = '';
        let currentClass = '';
        
        // Check auth
        if (!isLoggedIn()) {
            window.location.href = '../../student.html';
        }
        
        // Update welcome message
        const user = getStoredUser();
        if (user) {
            document.getElementById('welcome-name').textContent = `Welcome, ${user.first_name}!`;
        }
        
        // Load classes for filter
        async function loadClassFilter() {
            try {
                const response = await getClasses();
                if (response.success) {
                    const select = document.getElementById('filterClass');
                    response.data.classes.forEach(cls => {
                        const option = document.createElement('option');
                        option.value = cls.id;
                        option.textContent = `${cls.subject_name} (${cls.course_code})`;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading classes:', error);
            }
        }
        
        // Load classwork
        async function loadClasswork() {
            try {
                const response = await getClasswork(currentClass || null, currentType || null);
                if (response.success) {
                    allClasswork = response.data.classwork;
                    renderClasswork(allClasswork);
                }
            } catch (error) {
                console.error('Error loading classwork:', error);
                document.getElementById('classwork-list').innerHTML = `
                    <div class="alert alert-danger">Failed to load classwork</div>
                `;
            }
        }
        
        // Render classwork
        function renderClasswork(classwork) {
            const container = document.getElementById('classwork-list');
            
            if (!classwork || classwork.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-tasks"></i>
                        <h4>No Classwork</h4>
                        <p>There is no classwork to display for the selected filters.</p>
                    </div>
                `;
                return;
            }
            
            // Group by subject
            const grouped = {};
            classwork.forEach(item => {
                const key = `${item.subject_name} (${item.course_code})`;
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(item);
            });
            
            let html = '';
            for (const [subject, items] of Object.entries(grouped)) {
                html += `
                    <div class="mb-4">
                        <h5 class="text-warning mb-3"><i class="fas fa-book-open me-2"></i>${escapeHtml(subject)}</h5>
                        ${items.map(item => `
                            <div class="classwork-item">
                                <div class="icon ${item.type}">
                                    <i class="fas fa-${getTypeIcon(item.type)}"></i>
                                </div>
                                <div class="info">
                                    <h6 class="mb-0">${escapeHtml(item.title)}</h6>
                                    <small>${escapeHtml(item.description || 'No description')}</small>
                                </div>
                                <div class="due">
                                    ${item.due_date ? `
                                        <div class="date">${formatDate(item.due_date)}</div>
                                        <span class="badge ${getStatusBadge(item)}">${getStatusText(item)}</span>
                                    ` : `
                                        <span class="badge bg-secondary">No due date</span>
                                    `}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        // Helper functions
        function getTypeIcon(type) {
            const icons = {
                'lesson': 'book',
                'lab': 'flask',
                'quiz': 'question-circle',
                'assignment': 'file-alt'
            };
            return icons[type] || 'file';
        }
        
        function getStatusBadge(item) {
            if (item.submission_status === 'graded') return 'bg-success';
            if (item.submission_status === 'submitted') return 'bg-info';
            if (item.due_date && new Date(item.due_date) < new Date()) return 'bg-danger';
            return 'bg-warning text-dark';
        }
        
        function getStatusText(item) {
            if (item.submission_status === 'graded') return `Graded: ${item.grade}/${item.max_points || 100}`;
            if (item.submission_status === 'submitted') return 'Submitted';
            if (item.due_date && new Date(item.due_date) < new Date()) return 'Overdue';
            return 'Pending';
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        // Tab clicks
        document.querySelectorAll('#classworkTabs .nav-link').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#classworkTabs .nav-link').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentType = this.dataset.type;
                document.getElementById('filterType').value = currentType;
                loadClasswork();
            });
        });
        
        // Filter changes
        document.getElementById('filterClass').addEventListener('change', function() {
            currentClass = this.value;
            loadClasswork();
        });
        
        document.getElementById('filterType').addEventListener('change', function() {
            currentType = this.value;
            document.querySelectorAll('#classworkTabs .nav-link').forEach(b => {
                b.classList.toggle('active', b.dataset.type === currentType);
            });
            loadClasswork();
        });
        
        // Logout
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            logoutUser();
        });
        
        // Nav toggle
        document.querySelector('.nav-toggle').addEventListener('click', () => {
            document.querySelector('.nav-links').classList.toggle('show');
        });
        
        // Initialize
        loadClassFilter();
        loadClasswork();
    </script>
</body>
</html>
