<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elixr University | Announcements</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css"/>
    <link rel="stylesheet" href="../../css/dashboard.css"/>
</head>
<body>
    <!-- Nav -->
    <nav>
      <button class="nav-toggle" aria-label="toggle menu">
        <i class="fas fa-bars"></i>
      </button>
    
      <ul class="mb-0 nav-links">
        <li class="nav-item"><a class="nav-link" href="../../student.html">HOME</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">DASHBOARD</a></li>
        <li class="nav-item"><a class="nav-link" href="calendar.html">CALENDAR</a></li>
        <li class="nav-item"><a class="nav-link active" href="announcements.html">ANNOUNCEMENTS</a></li>
        <li class="nav-item"><a class="nav-link" href="classwork.html">CLASSWORK</a></li>
        
        <li class="nav-item dropdown" id="welcome-dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
            <span id="welcome-name">Welcome!</span>
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
          </ul>
        </li>
      </ul>
      <div class="logo">
        <span class="uni-name">Elixr University</span>
        <img src="../img/elixr_logo.jpg" alt="Logo" />
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-bullhorn me-2 text-warning"></i>Announcements</h2>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchAnnouncements" placeholder="Search announcements...">
            </div>
        </div>
        
        <!-- Filter by class -->
        <div class="mb-4">
            <select class="form-select bg-dark text-light border-warning" id="filterClass" style="max-width: 300px;">
                <option value="">All Classes</option>
            </select>
        </div>
        
        <!-- Announcements List -->
        <div id="announcements-list">
            <div class="text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2">Loading announcements...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-5">
        <p>&copy; 2026 Elixr University. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script>
        let allAnnouncements = [];
        
        // Check auth
        if (!isLoggedIn()) {
            window.location.href = '../../student.html';
        }
        
        // Update welcome message
        const user = getStoredUser();
        if (user) {
            document.getElementById('welcome-name').textContent = `Welcome, ${user.first_name}!`;
        }
        
        // Load classes for filter
        async function loadClassFilter() {
            try {
                const response = await getClasses();
                if (response.success) {
                    const select = document.getElementById('filterClass');
                    response.data.classes.forEach(cls => {
                        const option = document.createElement('option');
                        option.value = cls.id;
                        option.textContent = `${cls.subject_name} (${cls.course_code})`;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading classes:', error);
            }
        }
        
        // Load announcements
        async function loadAnnouncements(classId = null) {
            try {
                const response = await getAnnouncements(classId);
                if (response.success) {
                    allAnnouncements = response.data.announcements;
                    renderAnnouncements(allAnnouncements);
                }
            } catch (error) {
                console.error('Error loading announcements:', error);
                document.getElementById('announcements-list').innerHTML = `
                    <div class="alert alert-danger">Failed to load announcements</div>
                `;
            }
        }
        
        // Render announcements
        function renderAnnouncements(announcements) {
            const container = document.getElementById('announcements-list');
            
            if (!announcements || announcements.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-bullhorn"></i>
                        <h4>No Announcements</h4>
                        <p>There are no announcements to display.</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = announcements.map(ann => `
                <div class="announcement-card">
                    <div class="header">
                        <div>
                            <h5 class="title">${escapeHtml(ann.title)}</h5>
                            <span class="badge bg-warning text-dark">${escapeHtml(ann.subject_name)}</span>
                        </div>
                        <div class="meta">
                            <i class="fas fa-user me-1"></i>${escapeHtml(ann.author_name)}<br>
                            <i class="fas fa-clock me-1"></i>${formatDateTime(ann.created_at)}
                        </div>
                    </div>
                    <div class="content mt-3">
                        ${escapeHtml(ann.content)}
                    </div>
                </div>
            `).join('');
        }
        
        // Search functionality
        document.getElementById('searchAnnouncements').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const filtered = allAnnouncements.filter(ann => 
                ann.title.toLowerCase().includes(query) || 
                ann.content.toLowerCase().includes(query) ||
                ann.subject_name.toLowerCase().includes(query)
            );
            renderAnnouncements(filtered);
        });
        
        // Filter by class
        document.getElementById('filterClass').addEventListener('change', function() {
            loadAnnouncements(this.value || null);
        });
        
        // Helper functions
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        // Logout
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            logoutUser();
        });
        
        // Nav toggle
        document.querySelector('.nav-toggle').addEventListener('click', () => {
            document.querySelector('.nav-links').classList.toggle('show');
        });
        
        // Initialize
        loadClassFilter();
        loadAnnouncements();
    </script>
</body>
</html>
